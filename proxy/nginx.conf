events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # 도커 컴포즈 네트워크 상의 컨테이너명을 upstream으로 지정.
  # 백엔드 IP가 바뀌어도 'express-server' 이름으로 항상 라우팅됩니다.
  upstream api_backend {
    server express-server:3000;
  }

  server {
    listen 80;

    # 1) API 요청은 Express 컨테이너로 프록시
    location /api/ {
      proxy_pass         http://api_backend;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      client_max_body_size 5m;   # OCR 텍스트 등 여유
    }

    # 2) 정적 자산(빌드된 React)은 Nginx가 직접 서빙
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅: 존재하지 않는 경로는 index.html로 폴백
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
