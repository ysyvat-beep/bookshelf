name: CI / CD

# main 브랜치에 push 되거나 PR 이 열릴 때 실행됩니다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # 1단계: CI — 빌드가 깨지지 않는지 검사
  # ──────────────────────────────────────────────
  ci:
    name: 빌드 검사 (CI)
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 서버 의존성 설치 (better-sqlite3 네이티브 빌드 포함)
      - name: 서버 의존성 설치
        run: npm install
        working-directory: server

      # 프론트엔드 빌드 (Vite → dist/)
      # VITE_API_BASE: Render 백엔드 URL (Actions Secret으로 관리)
      - name: 프론트엔드 의존성 설치 & 빌드
        run: |
          npm install
          npx vite build --outDir dist --emptyOutDir
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ secrets.RENDER_API_URL }}

  # ──────────────────────────────────────────────
  # 2단계: CD — main 에 머지됐을 때만 Render 배포 트리거
  # CI 가 통과한 뒤에만 실행 (needs: ci)
  # ──────────────────────────────────────────────
  deploy:
    name: Render 배포 (CD)
    runs-on: ubuntu-latest
    needs: ci
    # main 으로의 직접 push 일 때만 배포 (PR 은 제외)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Render 는 GitHub 연동만 해도 자동 배포되지만,
      # Deploy Hook 을 사용하면 CI 통과 후 명시적으로 배포를 트리거할 수 있습니다.
      - name: 백엔드 배포 트리거 (express-server)
        run: |
          echo "백엔드 배포 시작..."
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"
          echo "배포 트리거 완료"

      - name: 프론트엔드 배포 트리거 (static site)
        run: |
          echo "프론트엔드 배포 시작..."
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"
          echo "배포 트리거 완료"
