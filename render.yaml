# Render.com 배포 설정 파일 (무료 플랜 기준)
#
# 서비스 구성
#   bookshelf-api  → Express 백엔드 (Node.js Web Service)
#   bookshelf-web  → React 프론트엔드 (Static Site)

services:
  # ── 백엔드: Express + SQLite ──────────────────────────────────
  - type: web
    name: bookshelf-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    plan: free                  # 무료 플랜
    envVars:
      - key: KAKAO_API_KEY
        sync: false             # Render 대시보드에서 직접 입력
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: ./bookshelf.db   # 컨테이너 내부 임시 저장 (무료 플랜)

  # ── 프론트엔드: React 정적 사이트 ────────────────────────────
  - type: web
    name: bookshelf-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npx vite build --outDir dist --emptyOutDir
    staticPublishPath: dist
    plan: free                  # 무료 플랜
    envVars:
      - key: VITE_API_BASE
        sync: false             # 배포 후 백엔드 URL 입력 (예: https://bookshelf-api.onrender.com)
    # SPA 라우팅 폴백
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
